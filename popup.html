<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>YouTube Nano Chapters</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #fff;
        --button: #f1f3f4;
        --button-hover: #e5e7e9;
        --button-active: #dadddf;
        --text: #202124;
        --muted: #5f6368;
        --accent: #1a73e8;
        --error: #b3261e;
        --track: #c4c7c5;
        --knob: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #292a2d;
          --button: #3c4043;
          --button-hover: #484c50;
          --button-active: #53575b;
          --text: #f1f3f4;
          --muted: #bdc1c6;
          --accent: #8ab4f8;
          --error: #f2b8b5;
          --track: #5f6368;
          --knob: #e8eaed;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 192px;
        margin: 0;
        padding: 8px 10px;
        background: var(--surface);
        color: var(--text);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        min-height: 36px;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--button);
        color: var(--text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--button-hover);
      }
      button:active:not(:disabled) {
        background: var(--button-active);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        color: var(--muted);
        cursor: default;
      }
      body[data-state="working"] button {
        cursor: progress;
      }

      .button-label {
        display: inline-flex;
      }
      .loading-dots {
        display: none;
      }
      body[data-state="working"] .loading-dots {
        display: inline-block;
        animation: loading-dots 1.2s steps(1, end) infinite;
      }

      @keyframes loading-dots {
        0% {
          clip-path: inset(0 66.666% 0 0);
        }
        33.333% {
          clip-path: inset(0 33.333% 0 0);
        }
        66.666% {
          clip-path: inset(0);
        }
      }

      #status {
        margin: 8px 4px 2px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
        white-space: pre-line;
      }

      #status:empty {
        display: none;
      }
      body[data-state="error"] #status {
        color: var(--error);
      }

      /* Only a device with the model can name chapters again, so the arrow rides the button in that state alone. */
      #again {
        flex: none;
        width: 15px;
        height: 15px;
      }

      #again[hidden] {
        display: none;
      }

      #offer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 8px 2px 2px;
        color: var(--muted);
        font-size: 12px;
      }

      #offer[hidden] {
        display: none;
      }
      /* The checkbox stays in the page for keyboard and screen readers; the track and knob draw it. */
      #opt-in {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .switch {
        position: relative;
        flex: none;
        width: 26px;
        height: 14px;
        border-radius: 7px;
        background: var(--track);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--knob);
      }
      #opt-in:checked + .switch {
        background: var(--accent);
      }
      #opt-in:checked + .switch::after {
        transform: translateX(12px);
      }
      #opt-in:focus-visible + .switch {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body data-state="idle">
    <button id="create" type="button" aria-describedby="status">
      <span class="button-label"
        ><span id="label" aria-live="polite">Generate chapters</span
        ><span class="loading-dots" aria-hidden="true">...</span></span
      ><svg
        id="again"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
        hidden
      >
        <path d="M20 12a8 8 0 1 1-2.3-5.6" />
        <path d="M20 4v4h-4" />
      </svg>
    </button>
    <label id="offer" hidden>
      <span>Gemini Nano titles</span>
      <input id="opt-in" type="checkbox" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <script src="generation.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
